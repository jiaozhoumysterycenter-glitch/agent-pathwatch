name: Bug report
description: Report incorrect content-silent behavior using synthetic evidence.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real session file or paste message, reasoning, tool, path, ID, or credential data.
        Reproduce the problem with a synthetic JSONL fixture whenever possible.
  - type: input
    id: version
    attributes:
      label: Agent Pathwatch version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v20.20.2
    validations:
      required: true
  - type: textarea
    id: safe-command
    attributes:
      label: Content-free command shape
      description: Replace private paths with placeholders such as SESSION.jsonl.
      render: shell
      placeholder: agent-pathwatch inspect SESSION.jsonl --format json
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe behavior without pasting raw input or output content.
    validations:
      required: true
  - type: textarea
    id: quality-codes
    attributes:
      label: Data-quality codes, counts, and exit code
      description: Include only the safe codes and numeric counts already emitted by Agent Pathwatch.
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Public-data check
      options:
        - label: I removed real session content, credentials, IDs, private paths, and raw errors.
          required: true
